# Template entities
- cover:
    - name: "Garage Door"
      unique_id: "garage_door_cover"
      device_class: garage
      state: >
        {% if is_state('binary_sensor.garage_door','on') %}
          Open
        {% else %}
          Closed
        {% endif %}
      icon: >
        {% if is_state('binary_sensor.garage_door','on') %}
          mdi:garage-open
        {% else %}
          mdi:garage
        {% endif %}
      open_cover:
        - action: switch.turn_on
          data:
            entity_id: switch.garage
      close_cover:
        - action: switch.turn_on
          data:
            entity_id: switch.garage
      stop_cover:
        - action: switch.turn_on
          data:
            entity_id: switch.garage

- sensor:
    - name: "Diff on office temp"
      unit_of_measurement: "°C"
      state: "{{states('sensor.bureau_temperature')|float - states('sensor.office_sensor_temp')|float}}"

- lock:
    - name: "Front Door 130"
      unique_id: "front_door_130"
      state: >
        {% if is_state('binary_sensor.voordeur_130_door', 'on') %}
          open
        {% elif is_state('lock.nuki', 'locked') %}
          locked
        {% else %}
          unlocked
        {% endif %}
      availability: "{{ states('lock.nuki') not in ['unavailable', 'unknown'] }}"
      lock:
        action: lock.lock
        target:
          entity_id: lock.nuki
      unlock:
        action: lock.open
        target:
          entity_id: lock.nuki
